name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/apps/OharaBack-End--NestJS-
            git pull origin main
            docker compose up -d --build --force-recreate
            
            echo "Aguardando 10 segundos para verificar a saúde do container..."
            sleep 10
            
            if [ -z "$(docker ps -q -f name=ohara-backend -f status=running)" ]; then
              echo "Erro: O container falhou ao iniciar ou está em loop de reinício (crash)!"
              docker logs ohara-backend
              exit 1
            fi
            
            echo "Deploy validado com sucesso! O container está rodando perfeitamente."