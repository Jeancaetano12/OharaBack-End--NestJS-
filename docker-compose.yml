version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ohara-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ohara-network

  backend:
    build: .
    container_name: ohara-backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@ohara-postgres:5432/${DB_NAME}?schema=public"
    depends_on:
      - postgres
    networks:
      - ohara-network

networks:
  ohara-network:
    external: true

volumes:
  pgdata:
