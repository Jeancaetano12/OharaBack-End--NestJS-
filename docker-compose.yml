services:
  postgres:
    image: postgres:16-alpine
    container_name: ohara-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ohara-network

  migrate:
    build:
      context: .
      target: migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - ohara-network

  backend:
    build:
      context: .
      target: production
    env_file:
      - .env
    container_name: ohara-backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - ohara-network

networks:
  ohara-network:
    external: true

volumes:
  pgdata:
